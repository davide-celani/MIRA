name: R CMD check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          # Matrix >= 1.7 requires R >= 4.4; 1.6-5 supports this minimum-R
          # profile and the Matrix >= 1.5 requirement of lme4. This is a
          # compatibility profile, not a test against all latest dependencies.
          - {os: ubuntu-latest, r: '4.2.3', matrix-package: 'Matrix@1.6-5'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      MIRA_RUN_CMDSTAN_TESTS: 'false'
      MIRA_RUN_QUARTO_TESTS: 'false'
      MIRA_RUN_QUARTO_PDF_TESTS: 'false'
      _R_CHECK_FORCE_SUGGESTS_: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          extra-repositories: https://stan-dev.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Include every MIRA test dependency without following Enhances.
          # Matrix 1.6-5 Enhances graph; graph is not required to check MIRA.
          dependencies: 'c("Depends", "Imports", "LinkingTo", "Suggests")'
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.config.matrix-package }}
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  quarto-integration:
    runs-on: ubuntu-latest
    name: Real Quarto HTML and DOCX (R release)
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MIRA_RUN_CMDSTAN_TESTS: 'false'
      MIRA_RUN_QUARTO_TESTS: 'true'
      # PDF is a separate profile requiring an existing TeX toolchain.
      MIRA_RUN_QUARTO_PDF_TESTS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          extra-repositories: https://stan-dev.r-universe.dev
      # Tool installation is an explicit CI setup step. Tests never install
      # Quarto, CmdStan, TeX, or missing R packages themselves.
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Require the configured renderer
        run: quarto --version
      - name: Install the package for integration testing
        run: R CMD INSTALL .
      - name: Render and inspect actual HTML and DOCX output
        shell: Rscript {0}
        run: |
          stopifnot(requireNamespace("MIRA", quietly = TRUE))
          testthat::test_dir(
            "tests/testthat",
            filter = "mira-report-freq_long-(integration|rendering-contracts)",
            package = "MIRA", load_package = "installed",
            stop_on_failure = TRUE, stop_on_warning = TRUE
          )
