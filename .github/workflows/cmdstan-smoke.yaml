name: CmdStan smoke tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MIRA_RUN_CMDSTAN_TESTS: 'true'
      CMDSTAN_VERSION: '2.39.0'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://stan-dev.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check
      - name: Install CmdStan
        shell: Rscript {0}
        run: |
          cmdstanr::install_cmdstan(version = Sys.getenv("CMDSTAN_VERSION"), cores = 2)
          cat(sprintf("CMDSTAN=%s\n", cmdstanr::cmdstan_path()),
              file = Sys.getenv("GITHUB_ENV"), append = TRUE)
      - name: Compile and sample the longitudinal model
        shell: Rscript {0}
        run: |
          cmdstanr::set_cmdstan_path(Sys.getenv("CMDSTAN"))
          cmdstanr::cmdstan_version()
          devtools::test(filter = "dynamic-covariates_long", stop_on_failure = TRUE)
