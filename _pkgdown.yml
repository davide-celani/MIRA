url: https://davide-celani.github.io/MIRA/

template:
  bootstrap: 5
  bslib:
    base_font:
      google:
        family: STIX Two Text
        wght: "400..700"
        ital: [0, 1]
    heading_font: STIX Two Text
    headings-font-weight: 600
    bg: "#FFFFFF"
    fg: "#263547"
    primary: "#415979"
    secondary: &mira-navy "#30435A"
    headings-color: *mira-navy
    link-hover-color: *mira-navy
    light: &mira-tint "#F2F5F8"
    border-color: "#DEE5ED"
    code-color: *mira-navy
    code-bg: *mira-tint
    table-striped-bg: *mira-tint
    navbar-dark-color: "#E8EEF5"
    navbar-dark-hover-color: white
    pkgdown-footer-bg: *mira-tint

navbar:
  bg: secondary
  type: dark

home:
  sidebar:
    structure: [project-links, license, community, citation, authors, dev]
    components:
      project-links:
        title: Links
        text: |
          - [Browse source code](https://github.com/davide-celani/MIRA)
          - [Report a bug](https://github.com/davide-celani/MIRA/issues)

articles:
- title: MIRA
  navbar: ~
  contents:
  - MIRA
- title: Frequentist Ophthalmic Longitudinal Analysis
  navbar: Frequentist longitudinal
  contents:
  - frequentist-long-getting-started
  - frequentist-long-data-and-detection
  - frequentist-long-descriptive-analysis
  - frequentist-long-treatment-groups
  - frequentist-long-missing-data
  - frequentist-long-multiple-outcomes
  - frequentist-long-first-model
  - frequentist-long-advanced-models
  - frequentist-long-reporting
  - frequentist-long-complete-workflow
